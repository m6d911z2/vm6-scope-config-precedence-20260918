name: VM6 firstparty labels-copier provenance test 261013
on:
  pull_request_target:
    types: [opened]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  vm6-label-copier:
    runs-on: ubuntu-latest
    steps:
      - name: Copy selected labels by official Mergify Action
        uses: Mergifyio/gha-mergify-merge-queue-labels-copier@v6
        with:
          labels: vm6-owner-only-gate-261013
          additional-labels: ''
          token: ${{ github.token }}
